<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#111;}
  .stage{ width:1500px; height:2250px; display:flex; align-items:center; justify-content:center; padding:60px; }
  .paper{
    width:100%; height:100%;
    background:#FFF8EC; border:10px solid #E8DDC9; border-radius:4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:80px 90px; position:relative;
    background-image:
      radial-gradient(ellipse at 20% 30%, rgba(184,173,154,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(184,173,154,0.08) 0%, transparent 50%);
  }
  .label{
    position:absolute; top:42px; left:50%; transform:translateX(-50%);
    font:600 11px 'Inter', sans-serif; letter-spacing:0.36em; text-transform:uppercase; color:#C8BFB0;
    white-space:nowrap;
  }
  .stack{ width:100%; display:flex; flex-direction:column; align-items:center; text-align:center; }
  /* BASE REFINED V1 */
  .h1, .h2{
    font-family:'Anton', sans-serif; color:#0A0A0A; text-transform:uppercase; text-wrap:balance;
  }
  /* v1a: Fixed — hairline = text width, optical sizing, hierarchy */
  .v1a .h1{ font-size:184px; line-height:0.86; letter-spacing:0.01em; }
  .v1a .h2{ font-size:184px; line-height:0.86; letter-spacing:0.01em; }
  .v1a .hair{ width:520px; height:1.5px; background:#D8CFC0; }
  .v1a .stack{ gap:20px; }

  /* v1b: Hierarchy — 1% BETTER slightly larger than EVERY DAY + tighter leading */
  .v1b .h1{ font-size:188px; line-height:0.84; letter-spacing:0.005em; }
  .v1b .h2{ font-size:152px; line-height:0.88; letter-spacing:0.06em; }
  .v1b .hair{ width:440px; height:1px; background:#D8CFC0; opacity:0.9; }
  .v1b .stack{ gap:16px; }

  /* v1c: Optical center + generous tracking (luxury) */
  .v1c .h1{ font-size:172px; line-height:0.90; letter-spacing:0.04em; }
  .v1c .h2{ font-size:172px; line-height:0.90; letter-spacing:0.04em; }
  .v1c .hair{ width:120px; height:1px; background:#C8BFB0; }
  .v1c .stack{ gap:24px; }
  .v1c.paper{ padding-top:60px; padding-bottom:100px; } /* optical lift */

  /* v1d: Tight editorial — negative space reduced, type 15% larger */
  .v1d .h1{ font-size:198px; line-height:0.84; letter-spacing:-0.01em; }
  .v1d .h2{ font-size:198px; line-height:0.84; letter-spacing:-0.01em; }
  .v1d .hair{ width:680px; height:1px; background:#E8DDC9; }
  .v1d .stack{ gap:18px; }

</style>
</head>
<body>
<div class="stage">
  <div class="paper" id="paper">
    <div class="label" id="label"></div>
    <div class="stack" id="stack"></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const v = q.get('v') || 'v1a';
document.getElementById('paper').classList.add(v);
const stack = document.getElementById('stack');
const map = {
  v1a: `<div class="hair"></div><div class="h1">1% BETTER</div><div class="h2">EVERY DAY</div><div class="hair"></div>`,
  v1b: `<div class="hair"></div><div class="h1">1% BETTER</div><div class="h2">EVERY DAY</div><div class="hair"></div>`,
  v1c: `<div class="hair"></div><div class="h1">1% BETTER</div><div class="h2">EVERY DAY</div><div class="hair"></div>`,
  v1d: `<div class="hair"></div><div class="h1">1% BETTER</div><div class="h2">EVERY DAY</div><div class="hair"></div>`,
};
stack.innerHTML = map[v];
const labels = {
  v1a:'V1A — FIXED (hairline = text width, balanced)',
  v1b:'V1B — HIERARCHY (BETTER larger, EVERY DAY tracked)',
  v1c:'V1C — OPTICAL + LUXURY (looser tracking, lifted)',
  v1d:'V1D — TIGHT + BOLD (max impact, reduced space)',
};
document.getElementById('label').textContent = labels[v];
</script>
</body>
</html>
