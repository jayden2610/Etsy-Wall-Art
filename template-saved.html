<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cormorant+Garamond:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,480&family=IBM+Plex+Sans:wght@500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#111}
  .stage{width:__STAGE_W__px;height:__STAGE_H__px;display:flex;align-items:center;justify-content:center}
  .paper{
    width:100%;height:100%;background:#FFFFFF;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:11% 9%;
  }
  .stack{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}

  .d5 .stack{gap:8px}
  .d5 .display{font:400 128px 'Instrument Serif',serif;font-style:italic;line-height:0.98;color:#3E5C6E}
  .d5 .support{font:400 92px 'Instrument Serif',serif;line-height:1.02;color:#3E5C6E}

  .d6 .stack{gap:18px}
  .d6 .display{font:900 188px 'Fraunces',serif;line-height:0.82;letter-spacing:-0.03em;color:#C23B22;text-transform:uppercase}
  .d6 .support{font:500 38px 'IBM Plex Sans',sans-serif;letter-spacing:0.16em;text-transform:uppercase;color:#111}

  .d8 .stack{gap:8px}
  .d8 .display{font:700 92px 'Cormorant Garamond',serif;line-height:1.02;letter-spacing:0.14em;text-transform:uppercase;color:#2A241C}

  .d11.paper{background:#352418;padding:10% 8%}
  .d11 .display{font:400 var(--d11-size, 188px) 'Abril Fatface',serif;line-height:0.78;letter-spacing:-0.03em;text-transform:uppercase;color:#E8D5B8}

  .d12.paper{background:#D7A888}
  .d12 .display{font:480 96px 'Fraunces',serif;font-style:italic;line-height:1.0;letter-spacing:-0.015em;color:#2A1C14}
</style>
</head>
<body>
<div class="stage">
  <div class="paper" id="paper">
    <div class="stack" id="stack"></div>
  </div>
</div>
<script>
const data = __DATA_JSON__;
const paper = document.getElementById('paper');
const stack = document.getElementById('stack');
paper.classList.add(data.dir);
if (data.dir === 'd11' && data.displaySize) {
  paper.style.setProperty('--d11-size', `${data.displaySize}px`);
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

function displayHtml() {
  if (Array.isArray(data.displayLines) && data.displayLines.length) {
    return data.displayLines.map((line) => escapeHtml(line)).join('<br>');
  }
  return escapeHtml(data.display || '');
}

const layouts = {
  d5: () => `<div class="display">${displayHtml()}</div><div class="support">${escapeHtml(data.support || '')}</div>`,
  d6: () => `<div class="display">${displayHtml()}</div><div class="support">${escapeHtml(data.support || '')}</div>`,
  d8: () => `<div class="display">${displayHtml()}</div>`,
  d11: () => `<div class="display">${displayHtml()}</div>`,
  d12: () => `<div class="display">${displayHtml()}</div>`,
};

const render = layouts[data.dir];
if (!render) {
  throw new Error(`Unknown saved direction: ${data.dir}`);
}
stack.innerHTML = render();
</script>
</body>
</html>
