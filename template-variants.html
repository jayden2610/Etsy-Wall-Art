<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=DM+Serif+Display&family=Instrument+Sans:wght@700&family=Libre+Baskerville:wght@400&family=Syne:wght@800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#111;}
  .stage{
    width:1500px; height:2250px;
    display:flex; align-items:center; justify-content:center;
    padding:60px;
  }
  .paper{
    width:100%; height:100%;
    background: #FFF8EC;
    border: 10px solid #E8DDC9;
    border-radius: 4px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding: 80px 90px;
    background-image: 
      radial-gradient(ellipse at 20% 30%, rgba(184,173,154,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(184,173,154,0.08) 0%, transparent 50%);
  }
  .stack{ text-align:center; width:100%; display:flex; flex-direction:column; align-items:center; gap: 4px; }
  .label{
    position:absolute; top:56px; left:50%; transform:translateX(-50%);
    font: 700 20px 'Space Grotesk', sans-serif;
    letter-spacing:0.22em; text-transform:uppercase; color:#D8CFC0;
  }
  /* font variants */
  .font-anton .headline, .font-anton .headline2{ font-family:'Anton', sans-serif; font-size:162px; line-height:0.92; letter-spacing:0.01em; }
  .font-bebas .headline, .font-bebas .headline2{ font-family:'Bebas Neue', sans-serif; font-size:198px; line-height:0.88; letter-spacing:0.03em; }
  .font-space .headline, .font-space .headline2{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:152px; line-height:0.95; letter-spacing:-0.03em; }
  .font-syne .headline, .font-syne .headline2{ font-family:'Syne', sans-serif; font-weight:800; font-size:148px; line-height:0.92; letter-spacing:-0.02em; }
  .font-archivo .headline, .font-archivo .headline2{ font-family:'Archivo Black', sans-serif; font-size:146px; line-height:0.92; letter-spacing:-0.01em; }
  .font-serif .headline, .font-serif .headline2{ font-family:'DM Serif Display', serif; font-size:150px; line-height:0.95; letter-spacing:0.01em; font-style:normal; }

  .headline, .headline2{ color:#0A0A0A; text-transform:uppercase; text-wrap:balance; text-align:center; }
  .percent{ display:inline-block; }
</style>
</head>
<body>
<div class="stage">
  <div class="paper" id="paper">
    <div class="label" id="label"></div>
    <div class="stack" id="stack">
      <div class="headline" id="h1">1% BETTER</div>
      <div class="headline2" id="h2">EVERY DAY</div>
    </div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const font = q.get('font') || 'anton';
document.getElementById('paper').classList.add('font-'+font);
document.getElementById('label').textContent = font;
</script>
</body>
</html>
