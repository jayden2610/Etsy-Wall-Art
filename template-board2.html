<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Fraunces:ital,opsz,wght@1,9..144,480&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#111}
  .stage{width:__STAGE_W__px;height:__STAGE_H__px;display:flex;align-items:center;justify-content:center}
  .paper{
    width:100%;height:100%;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:11% 9%;
  }
  .stack{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;z-index:1}

  /* D11 Packed cocoa — one fat serif, type is the picture */
  .d11.paper{background:#352418;padding:10% 8%}
  .d11 .display{font:400 188px 'Abril Fatface',serif;line-height:0.78;letter-spacing:-0.03em;text-transform:uppercase;color:#E8D5B8}

  /* D12 Sentence clay — speaking voice, not a shout */
  .d12.paper{background:#D7A888}
  .d12 .display{font:480 96px 'Fraunces',serif;font-style:italic;line-height:1.0;letter-spacing:-0.015em;color:#2A1C14}
</style>
</head>
<body>
<div class="stage">
  <div class="paper" id="paper">
    <div class="stack" id="stack"></div>
  </div>
</div>
<script>
const data = __DATA_JSON__;
const paper = document.getElementById('paper');
const stack = document.getElementById('stack');
paper.classList.add(data.dir);

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

function displayHtml() {
  if (Array.isArray(data.displayLines) && data.displayLines.length) {
    return data.displayLines.map((line) => escapeHtml(line)).join('<br>');
  }
  return escapeHtml(data.display || '');
}

const layouts = {
  d11: () => `<div class="display">${displayHtml()}</div>`,
  d12: () => `<div class="display">${displayHtml()}</div>`,
};

const render = layouts[data.dir];
if (!render) {
  throw new Error(`Unknown board direction: ${data.dir}`);
}
stack.innerHTML = render();
</script>
</body>
</html>
