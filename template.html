<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#111;}
  .stage{ width:__STAGE_W__px; height:__STAGE_H__px; display:flex; align-items:center; justify-content:center; padding:60px; }
  .paper{
    width:100%; height:100%;
    background:#FFFFFF; border:10px solid #FFFFFF;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:80px 90px; position:relative;
  }
  .stack{ width:100%; display:flex; flex-direction:column; align-items:center; text-align:center; gap:20px; }
  .h1, .h2{
    font-family:'Anton', sans-serif; font-size:184px; line-height:0.86; letter-spacing:0.01em;
    color:#0A0A0A; text-transform:uppercase; text-wrap:balance;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="paper" id="paper">
    <div class="stack" id="stack">
      <div class="h1" id="h1"></div>
      <div class="h2" id="h2"></div>
    </div>
  </div>
</div>
<script>
const data = __DATA_JSON__;
document.getElementById('h1').textContent = data.headline || '';
document.getElementById('h2').textContent = data.headline2 || '';
if(!data.headline2){ document.getElementById('h2').style.display='none'; }
</script>
</body>
</html>
